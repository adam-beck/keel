services:

  db:
    image: postgres:19beta3-alpine
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_USER: keel_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: keel
    secrets:
      - postgres_password
    ports:
      - 5432:5432

  caddy:
    image: caddy:2-alpine
    restart: always
    environment:
      UPSTREAM_PORT: ${UPSTREAM_PORT:-5173}
    ports:
      - 443:443
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/data/certs:ro
      - ./caddy:/etc/caddy/errors:ro

  backend:
    build:
      context: ./apps/backend
    restart: always
    ports:
      - 3000:3000
    environment:
      # have tsx's internal watcher poll rather than trust fs events, since
      # docker compose watch's sync writes files without necessarily
      # triggering inotify inside the container.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
      PGHOST: db
      PGPORT: "5432"
      PGUSER: keel_admin
      PGDATABASE: keel
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    depends_on:
      - db
    develop:
      watch:
        - action: sync
          path: ./apps/backend/src
          target: /app/src
        - action: rebuild
          path: ./apps/backend/package.json
        - action: rebuild
          path: ./apps/backend/nub.lock

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
